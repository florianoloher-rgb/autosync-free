plugins { id 'com.android.application' }
android {
    namespace 'com.example.autosyncfree'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.autosyncfree"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += [
                'META-INF/INDEX.LIST',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/io.netty.versions.properties'
            ]
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.api-client:google-api-client:2.5.0'
    implementation 'com.google.api-client:google-api-client-android:2.5.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20240521-2.0.0'
    implementation 'com.google.http-client:google-http-client-android:1.44.1'
    implementation 'com.google.http-client:google-http-client-gson:1.44.1'
}
